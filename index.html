<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sky小能手 ✨</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Quicksand", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
    }
    @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(5deg); }
    }
    @keyframes bounceIn {
        0% { opacity: 0; transform: scale(0.3) translateY(30px); }
        50% { transform: scale(1.05); }
        70% { transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes sparkle {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.2); }
    }
    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 50px 20px;
        position: relative;
        overflow-x: hidden;
        background: linear-gradient(-45deg, #ffecd2, #fcb69f, #a8edea, #fed6e3, #d299c2, #fef9d7);
        background-size: 400% 400%;
        animation: gradientBG 15s ease infinite;
    }
    .deco {
        position: fixed;
        pointer-events: none;
        z-index: 0;
        opacity: 0.6;
    }
    .deco-1 {
        top: 10%;
        left: 8%;
        font-size: 40px;
        animation: float 4s ease-in-out infinite;
    }
    .deco-2 {
        top: 20%;
        right: 10%;
        font-size: 35px;
        animation: floatSlow 5s ease-in-out infinite;
        animation-delay: 1s;
    }
    .deco-3 {
        bottom: 15%;
        left: 12%;
        font-size: 45px;
        animation: float 6s ease-in-out infinite;
        animation-delay: 0.5s;
    }
    .deco-4 {
        bottom: 25%;
        right: 8%;
        font-size: 38px;
        animation: floatSlow 4.5s ease-in-out infinite;
        animation-delay: 1.5s;
    }
    .deco-5 {
        top: 50%;
        left: 5%;
        font-size: 30px;
        animation: sparkle 3s ease-in-out infinite;
    }
    .deco-6 {
        top: 40%;
        right: 6%;
        font-size: 32px;
        animation: sparkle 2.5s ease-in-out infinite;
        animation-delay: 1s;
    }
    .nav-card {
        width: 100%;
        max-width: 400px;
        position: relative;
        z-index: 1;
        animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }
    .header {
        text-align: center;
        margin-bottom: 36px;
    }
    .avatar {
        width: 80px;
        height: 80px;
        margin: 0 auto 16px;
        background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        box-shadow: 0 8px 25px rgba(255, 154, 158, 0.4);
        animation: float 3s ease-in-out infinite;
    }
    .page-title {
        font-size: 26px;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 1px;
        margin-bottom: 8px;
    }
    .subtitle {
        font-size: 13px;
        color: rgba(102, 126, 234, 0.7);
        font-weight: 500;
        letter-spacing: 2px;
    }
    .link-group {
        margin-bottom: 20px;
    }
    .link-item {
        display: flex;
        align-items: center;
        width: 100%;
        padding: 18px 24px;
        margin-bottom: 14px;
        background: rgba(255, 255, 255, 0.55);
        backdrop-filter: blur(20px) saturate(180%);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1.5px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        color: #5a5a8a;
        text-decoration: none;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.5px;
        transition: all 0.35s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        cursor: pointer;
        position: relative;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.1);
    }
    .link-item::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
        transition: left 0.5s;
    }
    .link-item:hover::before {
        left: 100%;
    }
    .link-icon {
        font-size: 22px;
        margin-right: 14px;
        flex-shrink: 0;
        transition: transform 0.3s ease;
    }
    .link-text {
        flex: 1;
    }
    .link-arrow {
        font-size: 14px;
        opacity: 0.5;
        transition: all 0.3s ease;
    }
    .link-item:hover {
        transform: translateY(-4px) scale(1.02);
        box-shadow: 0 12px 30px rgba(102, 126, 234, 0.2);
        background: rgba(255, 255, 255, 0.7);
        border-color: rgba(255, 255, 255, 1);
    }
    .link-item:hover .link-icon {
        transform: scale(1.2) rotate(-5deg);
    }
    .link-item:hover .link-arrow {
        opacity: 1;
        transform: translateX(3px);
    }
    .link-item:active {
        transform: translateY(-1px) scale(0.98);
    }
    .link-item:last-child {
        margin-bottom: 0;
    }
    .divider {
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 32px 0;
        gap: 12px;
    }
    .divider-line {
        flex: 1;
        height: 2px;
        background: linear-gradient(90deg, transparent, rgba(102, 126, 234, 0.3), transparent);
        border-radius: 2px;
    }
    .divider-icon {
        font-size: 18px;
        animation: sparkle 2s ease-in-out infinite;
    }
    .section-title {
        text-align: center;
        font-size: 13px;
        font-weight: 700;
        color: rgba(102, 126, 234, 0.8);
        letter-spacing: 3px;
        text-transform: uppercase;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
    }
    .section-title::before,
    .section-title::after {
        content: '✦';
        font-size: 10px;
        opacity: 0.5;
    }
    .footer {
        text-align: center;
        margin-top: 36px;
        font-size: 12px;
        color: rgba(102, 126, 234, 0.5);
        letter-spacing: 1px;
    }
    .footer-hearts {
        margin-top: 8px;
        font-size: 14px;
        animation: sparkle 1.5s ease-in-out infinite;
    }
    @media (max-width: 480px) {
        body {
            padding: 30px 16px;
        }
        .nav-card {
            max-width: 100%;
        }
        .page-title {
            font-size: 22px;
        }
        .link-item {
            padding: 16px 20px;
            font-size: 14px;
        }
        .link-icon {
            font-size: 20px;
        }
        .modal-box {
            padding: 30px 24px 22px;
        }
    }
    @keyframes modalFadeIn {
        0% { opacity: 0; }
        100% { opacity: 1; }
    }
    @keyframes modalBounceIn {
        0% { opacity: 0; transform: scale(0.5) translateY(20px); }
        60% { transform: scale(1.05) translateY(-5px); }
        100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(102, 126, 234, 0.25);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: modalFadeIn 0.3s ease;
    }
    .modal-overlay.hidden {
        display: none;
    }
    .modal-box {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(30px) saturate(180%);
        -webkit-backdrop-filter: blur(30px) saturate(180%);
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 24px;
        padding: 36px 32px 28px;
        max-width: 340px;
        width: 90%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(102, 126, 234, 0.3);
        animation: modalBounceIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        position: relative;
    }
    .modal-icon {
        font-size: 48px;
        margin-bottom: 16px;
        animation: float 3s ease-in-out infinite;
    }
    .modal-title {
        font-size: 18px;
        font-weight: 700;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 14px;
    }
    .modal-text {
        font-size: 14px;
        color: #5a5a8a;
        line-height: 1.8;
        font-weight: 500;
        margin-bottom: 24px;
    }
    .modal-text .highlight {
        color: #ff6b9d;
        font-weight: 700;
    }
    .modal-close-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 36px;
        border-radius: 16px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        letter-spacing: 1px;
    }
    .modal-close-btn:hover {
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
    }
    .modal-close-btn:active {
        transform: translateY(0) scale(0.98);
    }
    .modal-close-x {
        position: absolute;
        top: 14px;
        right: 16px;
        font-size: 20px;
        color: rgba(102, 126, 234, 0.5);
        cursor: pointer;
        transition: all 0.3s ease;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
    }
    .modal-close-x:hover {
        color: #667eea;
        background: rgba(102, 126, 234, 0.1);
        transform: rotate(90deg);
    }
    </style>
</head>
<body>
    <div class="modal-overlay" id="welcomeModal">
        <div class="modal-box">
            <div class="modal-close-x" onclick="closeModal()">✕</div>
            <div class="modal-icon">💡</div>
            <div class="modal-title">温馨提示</div>
            <div class="modal-text">
                移动云盘下载<span class="highlight">不限速</span>哦<br>
                使用前请先看<span class="highlight">教程合集</span>
            </div>
            <button class="modal-close-btn" onclick="closeModal()">知道啦</button>
        </div>
    </div>
    <div class="deco deco-1">🌸</div>
    <div class="deco deco-2">⭐</div>
    <div class="deco deco-3">☁️</div>
    <div class="deco deco-4">🌙</div>
    <div class="deco deco-5">✨</div>
    <div class="deco deco-6">💫</div>
    <div class="nav-card">
        <div class="header">
            <div class="avatar">🐰</div>
            <h1 class="page-title">sky小能手</h1>
            <p class="subtitle">～ 欢迎光临 ～</p>
        </div>
        <div class="link-group">
            <a href="https://pan.baidu.com/s/1aenC-FArXXA8XaVO0Ry6EA?pwd=8888" class="link-item">
                <span class="link-icon">📦</span>
                <span class="link-text">百度网盘</span>
                <span class="link-arrow">→</span>
            </a>
            <a href="https://yun.139.com/shareweb/#/w/i/2xPCN2QPXbxfv" class="link-item">
                <span class="link-icon">📱</span>
                <span class="link-text">中国移动云盘</span>
                <span class="link-arrow">→</span>
            </a>
            <a href="https://pan.quark.cn/s/8e27081b39b4" class="link-item">
                <span class="link-icon">🚀</span>
                <span class="link-text">夸克网盘</span>
                <span class="link-arrow">→</span>
            </a>
        </div>
        <div class="divider">
            <div class="divider-line"></div>
            <span class="divider-icon">🌟</span>
            <div class="divider-line"></div>
        </div>
        <div class="section-title">教程专区</div>
        <div class="link-group">
            <a href="https://www.yuque.com/skyxiaonengshou/glnknn?#" class="link-item">
                <span class="link-icon">📚</span>
                <span class="link-text">教程合集</span>
                <span class="link-arrow">→</span>
            </a>
        </div>
        <div class="footer">
            Made with 💖 by sky
            <div class="footer-hearts">💕 ✨ 🌸</div>
        </div>
    </div>
    <script>
        function closeModal() {
            var modal = document.getElementById('welcomeModal');
            modal.style.opacity = '0';
            modal.style.transition = 'opacity 0.3s ease';
            setTimeout(function() {
                modal.classList.add('hidden');
            }, 300);
        }
        document.getElementById('welcomeModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
    </script>
</body>
</html>
